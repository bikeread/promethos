name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run skill validation
        run: ./scripts/validate-skills.sh

      - name: Check repository docs
        run: python3 ./scripts/check-repo-docs.py
